field_transform_rules:
  amount:
    strategy: field_level_unit_evidence
    default_action: block_unknown_unit
    target_type: Decimal128(2)
    scale: 2
    sign: preserve_source_sign
    empty: empty_or_null_to_NULL
    invalid: non_empty_unparseable_to_exception_count
    zero: preserve_zero
    fields:
      - source_field: sku_order_list.pay_amount
        chinese_name: 商品支付金额
        target_field: item_paid_amount
        unit: fen
        unit_evidence: 接口文档明确“支付金额（单位：分）”
        action: divide_by_100
        status: ready_after_approval
      - source_field: sku_order_list.goods_price
        chinese_name: 商品原价
        target_field: goods_amount
        unit: yuan
        unit_evidence: 用户确认商品原价按元处理
        action: preserve_and_standardize_scale_2
        status: ready_after_approval
  json_array:
    source_field: sku_order_list
    action: arrayJoin_with_1_based_item_index
    output_key: [shop_order_id, item_index]
    child_relations: all_relations_in_json_relation_contracts
  identifiers:
    zero_or_empty_to_NULL: [room_id, author_id]
  time:
    source_unit: unix_seconds
    timezone: Asia/Shanghai
    zero_to_NULL: [pay_time]
  enums:
    scan_only: [ad_env_type, b_type, sub_b_type, pay_type, order_status, main_status]
    no_enum_scan: [product_id, sku_id, item_num, pay_time, create_time, update_time]
quality_gates:
  - source_row_count_reconciles
  - expanded_item_count_reconciles
  - composite_key_unique
  - required_identifier_not_null
  - numeric_parse_errors_zero_for_confirmed_fields
  - amount_exception_count_reported
  - raw_json_absent_from_target
