contract_id: doudian_order_item
contract_version: 1.2.0
status: reviewed
decision_log:
  - decision: source_mode
    result: window_full_snapshot
    evidence:
      - table_suffix_is_f
      - one_snapshot_partition_2026-07-21
      - create_time_range_2026-04-23_to_2026-07-22
      - api_searchList_supports_recent_90_days
    limitation: not_historical_full
  - decision: grain
    result: one_sku_order_list_element_per_shop_order
    evidence:
      - sku_order_list_is_json_array
      - no_sku_order_id_coverage_in_current_ods
  - decision: key
    result: shop_order_id_plus_item_index
    evidence:
      - shop_order_id_unique_at_header_grain
      - product_id_sku_id_has_28_duplicate_combinations
    limitation: item_index_is_technical_source_array_position_not_business_suborder_id
  - decision: amount_unit_strategy
    result: field_level_unit_evidence
    evidence:
      - pay_amount_document_explicitly_states_unit_fen
      - goods_price_document_does_not_state_unit
    rule: only_amount_fields_with_explicit_unit_evidence_are_converted
    limitation: goods_price_uses_user_approved_yuan_unit_even_though_interface_text_is_silent
  - decision: goods_price_unit
    result: yuan
    evidence:
      - user_confirmed_goods_price_is_yuan
    rule: preserve_numeric_value_and_standardize_to_decimal128_scale_2
  - decision: json_expansion_scope
    result: all_interface_defined_json_fields
    evidence:
      - official_response_schema_inventory_contains_622_paths
      - current_ods_item_payload_contains_137_top_level_fields
    rule: scalar_flatten_object_recursive_flatten_array_separate_child_relation
    limitation: response_metadata_fields_not_observable_in_current_ods_are_registered_but_blocked
