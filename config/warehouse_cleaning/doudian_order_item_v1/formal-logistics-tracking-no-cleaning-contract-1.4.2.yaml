  package_id_policy: 包裹ID不作为目标粒度；包裹ID粒度数值字段先按快递单号汇总，平均型指标按快递单号取平均。
field_rules:
  json_expansion: 所有物流字段已按接口文档展开；物流商品关系按快递单号聚合，不保留原始JSON。
  chinese_name_policy: 物理字段保留英文标识，业务字段统一使用中文名和中文注释。
  null_policy: 空字符串或空值转NULL；非空非法值进入异常统计；合法0保留为0。
  numeric_policy: 数值字段按业务语义转换为数值类型，标识字段保留String。
  amount_policy: 金额字段逐字段依据单位证据处理，不按整表统一换算。
amount_rules:
  target_scale: 2
  sign_policy: 保留源值正负号，不取绝对值。
  source_fen_fields:
    - guarantee_amount
    - sp_discount_price
    - sp_price
    - sp_total_price
    - price
  source_fen_action: 除以100后按元写入Decimal(38,2)。
  average_metric: avg_product_price_amount按快递单号粒度取平均。
  additive_metrics:
    - guarantee_amount
    - platform_delivery_discount_amount
    - platform_delivery_paid_amount
    - platform_delivery_payable_amount
