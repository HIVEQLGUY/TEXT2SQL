  sql_template: "with daily_rows as (\n  select cast({biz_date_field} as date) as biz_date, count(*) as row_count\n  from {database_name}.{table_name}\n\
    \  where cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days} day)\n  group by cast({biz_date_field}\
    \ as date)\n),\nbaseline as (\n  select avg(row_count) as baseline_row_count\n  from daily_rows\n  where biz_date < date_sub(current_date(),\
