- rule_name: shangpinzhutifenxi_xiaojiacangku__cost_price_abnormal__cost_price_reasonableness
  rule_group: cost_price_abnormal
  description: 检查成本价/采购价非空、非负，以及同 SKU/商品相对近 30 天中位数的异常波动。
  target_fields:
  - 成本价
  - 主仓库存成本
  - 销退仓库存成本
  - 进货仓库存成本
  - 次品仓库存成本
  - 差异仓库存成本
  check_grain: table
  check_frequency: daily
  default_threshold:
    cost_price_null_rate_max: TODO_CONFIRM
    cost_price_min: 0
    high_ratio_to_30d_median: 3.0
    low_ratio_to_30d_median: 0.2
    history_window_days: 30
    todo: Confirm valid zero-cost scenarios, cost-source priority, and SKU/product comparison grain.
    profiling_status: TODO
    profiling_todo: 历史基线未在当前画像中落表。
  alert_level: low
  required_metadata:
  - table_name
  - database_name
  - cost_price_fields
  - join_key_fields
  - biz_date_field_candidate
  - sku_or_product_key
  sql_template: "-- TODO_CONFIRM: replace median expression with the SQL engine's approved percentile function.\nwith history_price as (\n  select\n\
    \    {sku_or_product_key},\n    percentile_approx({cost_price_field}, 0.5) as median_cost_price\n  from {database_name}.{table_name}\n  where\
    \ cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days} day)\n    and cast({biz_date_field} as date) <\
    \ current_date()\n  group by {sku_or_product_key}\n),\ncurrent_price as (\n  select {sku_or_product_key}, {cost_price_field}\n  from {database_name}.{table_name}\n\
    \  where cast({biz_date_field} as date) = date_sub(current_date(), interval 1 day)\n)\nselect count(*) as violation_count\nfrom current_price\
    \ c\njoin history_price h on c.{sku_or_product_key} = h.{sku_or_product_key}\nwhere c.{cost_price_field} > h.median_cost_price * {high_ratio_to_30d_median}\n\
    \   or c.{cost_price_field} < h.median_cost_price * {low_ratio_to_30d_median};\n"
  evidence:
