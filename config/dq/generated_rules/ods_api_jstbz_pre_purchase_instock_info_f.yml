- rule_name: ods_api_jstbz_pre_purchase_instock_info_f__promotion_fee_abnormal__promotion_fee_reasonableness
  rule_group: promotion_fee_abnormal
  description: 检查推广费/广告费非负，并按店铺/渠道/计划/日期与历史基线比较。
  target_fields:
  - send_address
  check_grain: partition
  check_frequency: daily
  default_threshold:
    promotion_fee_min: 0
    high_ratio_to_history: 3.0
    history_window_days: 30
    zero_fee_alert_policy: Do not alert on zero fee by default; compare with historical zero-rate and business calendar.
    todo: Confirm campaign calendar, channel grain, and whether zero-spend days are expected.
    profiling_status: TODO
    profiling_todo: 历史基线未在当前画像中落表。
  alert_level: low
  required_metadata:
  - table_name
  - database_name
  - promotion_fee_fields
  - biz_date_field_candidate
  - shop_field_candidate
  - channel_field_candidate
  - campaign_or_plan_field_candidate
  sql_template: "with daily_fee as (\n  select\n    cast({biz_date_field} as date) as biz_date,\n    {shop_channel_plan_fields},\n    sum({promotion_fee_field})\
    \ as fee_sum\n  from {database_name}.{table_name}\n  where cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days}\
    \ day)\n  group by cast({biz_date_field} as date), {shop_channel_plan_fields}\n),\nbaseline as (\n  select {shop_channel_plan_fields}, avg(fee_sum)\
    \ as avg_fee\n  from daily_fee\n  where biz_date < date_sub(current_date(), interval 1 day)\n  group by {shop_channel_plan_fields}\n),\ncurrent_day\
    \ as (\n  select {shop_channel_plan_fields}, fee_sum\n  from daily_fee\n  where biz_date = date_sub(current_date(), interval 1 day)\n)\nselect\
    \ count(*) as violation_count\nfrom current_day c\njoin baseline b using ({shop_channel_plan_fields})\nwhere c.fee_sum > b.avg_fee * {high_ratio_to_history};\n"
  evidence:
  - '生成原因: 字段画像识别到推广费、广告费或投放费用字段。'
  - 'information_schema.tables: row_count=2331, data_size=930070, update_time=2026-07-09 02:01:37'
  - 'information_schema.columns: field_count=18'
  - 'ods_db_cube_tables_config: primary_key=`__id`'
  - 'std_data_government_meta_table: owner=管理员, unused_days=0, layer_raw=ods'
  - 'ods_db_cube_partitions_meta: partition_count=1, latest_partition=ods_api_jstbz_pre_purchase_instock_info_f'
  todo:
  - 推广费为 0 不默认报警；需确认投放日历、渠道和计划粒度。
