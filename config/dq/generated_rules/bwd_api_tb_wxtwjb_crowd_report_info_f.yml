  sql_template: "with daily_amount as (\n  select cast({biz_date_field} as date) as biz_date, sum({amount_field}) as amount_sum\n  from {database_name}.{table_name}\n\
    \  where cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days} day)\n  group by cast({biz_date_field}\
    \ as date)\n),\nbaseline as (\n  select avg(amount_sum) as baseline_amount\n  from daily_amount\n  where biz_date < date_sub(current_date(),\
    \ interval 1 day)\n),\ncurrent_day as (\n  select coalesce(sum(amount_sum), 0) as current_amount\n  from daily_amount\n  where biz_date =\
    \ date_sub(current_date(), interval 1 day)\n)\nselect\n  case\n    when current_amount < baseline_amount * {current_sum_low_ratio_to_history}\n\
    \      or current_amount > baseline_amount * {current_sum_high_ratio_to_history}\n    then 1 else 0\n  end as violation_count\nfrom current_day\
    \ cross join baseline;\n"
