- rule_name: xiaohongshu_pugongyingshuju__promotion_fee_abnormal__promotion_fee_reasonableness
  rule_group: promotion_fee_abnormal
  description: 检查推广费/广告费非负，并按店铺/渠道/计划/日期与历史基线比较。
  target_fields:
