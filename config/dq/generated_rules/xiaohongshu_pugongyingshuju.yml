  - database_name
  - promotion_fee_fields
  - biz_date_field_candidate
  - shop_field_candidate
  - channel_field_candidate
  - campaign_or_plan_field_candidate
  sql_template: "with daily_fee as (\n  select\n    cast({biz_date_field} as date) as biz_date,\n    {shop_channel_plan_fields},\n    sum({promotion_fee_field})\
    \ as fee_sum\n  from {database_name}.{table_name}\n  where cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days}\
    \ day)\n  group by cast({biz_date_field} as date), {shop_channel_plan_fields}\n),\nbaseline as (\n  select {shop_channel_plan_fields}, avg(fee_sum)\
    \ as avg_fee\n  from daily_fee\n  where biz_date < date_sub(current_date(), interval 1 day)\n  group by {shop_channel_plan_fields}\n),\ncurrent_day\
    \ as (\n  select {shop_channel_plan_fields}, fee_sum\n  from daily_fee\n  where biz_date = date_sub(current_date(), interval 1 day)\n)\nselect\
    \ count(*) as violation_count\nfrom current_day c\njoin baseline b using ({shop_channel_plan_fields})\nwhere c.fee_sum > b.avg_fee * {high_ratio_to_history};\n"
