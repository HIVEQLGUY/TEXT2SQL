  - 推广阅读量
  check_grain: table
  check_frequency: daily
  default_threshold:
    promotion_fee_min: 0
    high_ratio_to_history: 3.0
    history_window_days: 30
    zero_fee_alert_policy: Do not alert on zero fee by default; compare with historical zero-rate and business calendar.
    todo: Confirm campaign calendar, channel grain, and whether zero-spend days are expected.
    profiling_status: TODO
    profiling_todo: 历史基线未在当前画像中落表。
