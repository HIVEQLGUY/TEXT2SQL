  check_grain: table
  check_frequency: daily
  default_threshold:
    cost_price_null_rate_max: TODO_CONFIRM
    cost_price_min: 0
    high_ratio_to_30d_median: 3.0
    low_ratio_to_30d_median: 0.2
    history_window_days: 30
    todo: Confirm valid zero-cost scenarios, cost-source priority, and SKU/product comparison grain.
    profiling_status: TODO
    profiling_todo: 历史基线未在当前画像中落表。
