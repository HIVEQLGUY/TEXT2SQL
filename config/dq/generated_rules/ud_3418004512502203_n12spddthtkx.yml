    profiling_status: TODO
    profiling_todo: 历史基线未在当前画像中落表。
  alert_level: medium
  required_metadata:
  - table_name
  - database_name
  - biz_date_field_candidate
  - row_count_history
  - latest_partition
  sql_template: "with daily_rows as (\n  select cast({biz_date_field} as date) as biz_date, count(*) as row_count\n  from {database_name}.{table_name}\n\
    \  where cast({biz_date_field} as date) >= date_sub(current_date(), interval {history_window_days} day)\n  group by cast({biz_date_field}\
    \ as date)\n),\nbaseline as (\n  select avg(row_count) as baseline_row_count\n  from daily_rows\n  where biz_date < date_sub(current_date(),\
    \ interval 1 day)\n),\ncurrent_day as (\n  select coalesce(sum(row_count), 0) as current_row_count\n  from daily_rows\n  where biz_date =\
    \ date_sub(current_date(), interval 1 day)\n)\nselect\n  case\n    when current_row_count < baseline_row_count * {low_ratio_to_history}\n\
    \      or current_row_count > baseline_row_count * {high_ratio_to_history}\n    then 1 else 0\n  end as violation_count\nfrom current_day\
    \ cross join baseline;\n"
