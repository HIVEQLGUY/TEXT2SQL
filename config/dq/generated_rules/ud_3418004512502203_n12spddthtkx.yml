- rule_name: ud_3418004512502203_n12spddthtkx__row_count_anomaly__partition_row_count_anomaly
  rule_group: row_count_anomaly
  description: 检查当前分区行数相对历史 7/14/30 天均值或中位数是否异常。
  target_fields:
  - modified
  check_grain: partition
  check_frequency: daily
  default_threshold:
    history_windows_days:
    - 7
    - 14
    - 30
    low_ratio_to_history: 0.5
    high_ratio_to_history: 2.0
    default_compare_statistic: median
