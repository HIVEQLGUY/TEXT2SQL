    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」或「空值个数/总行数，固定值」；第一阶段只预警，不阻断。
    sql_template: select sum(case when `商品ID` is null then 1 else 0 end) as `商品ID__null_count`, sum(case when `商品名称` is null then 1 else 0 end) as `商品名称__null_count`,
      sum(case when `商品关注数` is null then 1 else 0 end) as `商品关注数__null_count`, sum(case when `加购商品件数` is null then 1 else 0 end) as `加购商品件数__null_count`, sum(case
      when `成交商品件数` is null then 1 else 0 end) as `成交商品件数__null_count` from cubeappdata.`liuliangshuju` where cast(`最近上架时间` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
