  rules:
  - rule_name: ods_api_jstqm_sale_order_info_du__yesterday_biz_date_row_count_nonzero
    rule_type: 昨天业务日期行数存在
    description: 检查昨天业务日期是否有数据，避免结果表空跑。
    target_fields:
    - dt
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 表规则「单日行数，固定值」，日期参数传昨天业务日期；无日期字段时退化为任务产出行数 > 0。SQL 仅兜底。
    sql_template: select case when count(*) = 0 then 1 else 0 end as violation_count from cubeappdata.`ods_api_jstqm_sale_order_info_du` where cast(`dt` as date)
      = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 第一阶段只检查是否存在数据，不设置业务波动阈值。
  - rule_name: ods_api_jstqm_sale_order_info_du__primary_key_null_and_duplicate
    rule_type: 主键非空/重复
    description: 检查候选主键非空和重复。
    target_fields: *id006
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」和「重复值个数，固定值」；大表必须配置昨天分区或昨天业务日期参数。组合主键无法表达时 SQL 兜底。
    sql_template: select sum(case when `dt` is null or `__id` is null or `l_id` is null or `wms_co_id` is null then 1 else 0 end) as null_key_count, count(*) - count(distinct
      concat_ws('#', `dt`, `__id`, `l_id`, `wms_co_id`)) as duplicate_key_count from cubeappdata.`ods_api_jstqm_sale_order_info_du` where cast(`dt` as date) = date_sub(current_date(),
      interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 大表只建议按昨天分区/昨天业务日期范围查重，避免全表扫描。
  - rule_name: ods_api_jstqm_sale_order_info_du__core_fields_null
    rule_type: 核心字段空值
    description: 检查主键、业务日期、商品/店铺/订单/金额等核心字段空值。
    target_fields:
    - dt
    - __id
    - l_id
    - wms_co_id
    - as_id
    - outer_pay_id
    - so_id
    - shop_buyer_id
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」或「空值个数/总行数，固定值」；第一阶段只预警，不阻断。
    sql_template: select sum(case when `dt` is null then 1 else 0 end) as `dt__null_count`, sum(case when `__id` is null then 1 else 0 end) as `__id__null_count`,
      sum(case when `l_id` is null then 1 else 0 end) as `l_id__null_count`, sum(case when `wms_co_id` is null then 1 else 0 end) as `wms_co_id__null_count`, sum(case
      when `as_id` is null then 1 else 0 end) as `as_id__null_count` from cubeappdata.`ods_api_jstqm_sale_order_info_du` where cast(`dt` as date) = date_sub(current_date(),
      interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 核心字段来自字段名、候选主键、业务日期、金额/关联键证据，不依赖复杂业务口径。
  - rule_name: ods_api_jstqm_sale_order_info_du__amount_fields_format_and_non_negative
    rule_type: 金额字段格式/非负
    description: 检查金额、成本、推广费字段是否可转数字，以及一般金额是否出现负数。
    target_fields:
    - free_amount
    - pay_amount
    - paid_amount
    - buyer_paid_amount
    - seller_income_amount
    - cb_finances
    check_grain: latest_business_date_or_task_run
    bi_config_method: 数值字段优先使用 BI 字段规则「最小值/最大值」及波动类规则；文本金额字段先做空值/格式确认，数值可转换性用 SQL 兜底。
    sql_template: select sum(case when `free_amount` is not null and cast(`free_amount` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `free_amount__not_numeric_count`,
      sum(case when cast(`free_amount` as double) < 0 then 1 else 0 end) as `free_amount__negative_count`, sum(case when `pay_amount` is not null and cast(`pay_amount`
      as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `pay_amount__not_numeric_count`, sum(case when cast(`pay_amount` as double) < 0 then
      1 else 0 end) as `pay_amount__negative_count`, sum(case when `paid_amount` is not null and cast(`paid_amount` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false
      then 1 else 0 end) as `paid_amount__not_numeric_count`, sum(case when cast(`paid_amount` as double) < 0 then 1 else 0 end) as `paid_amount__negative_count`,
      sum(case when `buyer_paid_amount` is not null and cast(`buyer_paid_amount` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `buyer_paid_amount__not_numeric_count`,
      sum(case when cast(`buyer_paid_amount` as double) < 0 then 1 else 0 end) as `buyer_paid_amount__negative_count` from cubeappdata.`ods_api_jstqm_sale_order_info_du`
      where cast(`dt` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 阈值类波动暂不配置；负数是否允许需后续按字段确认。
  - rule_name: ods_api_jstqm_sale_order_info_du__biz_date_castable
