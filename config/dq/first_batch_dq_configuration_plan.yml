    rule_type: 字段结构变化
    description: 检查字段数量和关键字段是否发生变化。
    target_fields:
    - 商品ID
    - 商品名称
    - 商品关注数
    - 加购商品件数
    - 成交商品件数
    check_grain: table_schema
    bi_config_method: 优先配置字段存在/字段数规则；没有内置项时用自定义 SQL 查 information_schema.columns。
    sql_template: select case when count(*) < {expected_min_field_count} then 1 else 0 end as violation_count from information_schema.columns where table_schema='cubeappdata'
      and table_name='liuliangshuju';
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 用于发现影刀抓取页面/API 字段变更。
  - rule_name: liuliangshuju__primary_key_null_and_duplicate
    rule_type: 主键非空/重复
    description: 检查候选主键非空和重复。
    target_fields: *id028
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」和「重复值个数，固定值」；大表必须配置昨天分区或昨天业务日期参数。组合主键无法表达时 SQL 兜底。
    sql_template: select sum(case when `__id` is null or `商品ID` is null then 1 else 0 end) as null_key_count, count(*) - count(distinct concat_ws('#', `__id`, `商品ID`))
      as duplicate_key_count from cubeappdata.`liuliangshuju` where cast(`最近上架时间` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 可按昨天业务日期或任务产出行数查重。
  - rule_name: liuliangshuju__core_fields_null
    rule_type: 核心字段空值
    description: 检查主键、业务日期、商品/店铺/订单/金额等核心字段空值。
