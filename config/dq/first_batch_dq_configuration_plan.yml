  bi_configuration_feasibility:
    configuration_entry: 表对应更新任务的任务详情 -> 数据质量检查规则
    recommended_rule_types:
    - 表行数
    - 字段空值
    - 字段唯一/重复
    - 字段格式/自定义SQL
    - 字段结构变化
    large_table_safety: 大表只按昨天分区/昨天业务日期/任务产出行数检查，避免全表扫描。
    text_field_strategy: 文本字段先做非空、格式可转换和字段结构变化，不直接做复杂数值阈值。
  manual_confirm_required_before_config: false
  rules:
  - rule_name: ud_3418004512502203_sxssjqx__yesterday_biz_date_row_count_nonzero
    rule_type: 昨天业务日期行数存在
    description: 检查昨天业务日期是否有数据，避免结果表空跑。
    target_fields:
    - pay_time
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 表规则「单日行数，固定值」，日期参数传昨天业务日期；无日期字段时退化为任务产出行数 > 0。SQL 仅兜底。
    sql_template: select case when count(*) = 0 then 1 else 0 end as violation_count from cubeappdata.`ud_3418004512502203_sxssjqx` where cast(`pay_time` as date)
      = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 第一阶段只检查是否存在数据，不设置业务波动阈值。
  - rule_name: ud_3418004512502203_sxssjqx__primary_key_null_and_duplicate
    rule_type: 主键非空/重复
    description: 检查候选主键非空和重复。
    target_fields: *id012
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」和「重复值个数，固定值」；大表必须配置昨天分区或昨天业务日期参数。组合主键无法表达时 SQL 兜底。
    sql_template: select sum(case when `__id` is null or `order_id` is null or `skuid` is null or `doudian_open_id` is null then 1 else 0 end) as null_key_count,
      count(*) - count(distinct concat_ws('#', `__id`, `order_id`, `skuid`, `doudian_open_id`)) as duplicate_key_count from cubeappdata.`ud_3418004512502203_sxssjqx`
      where cast(`pay_time` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 可按昨天业务日期或任务产出行数查重。
  - rule_name: ud_3418004512502203_sxssjqx__core_fields_null
    rule_type: 核心字段空值
    description: 检查主键、业务日期、商品/店铺/订单/金额等核心字段空值。
    target_fields:
    - __id
    - order_id
    - spbm
    - skuid
    - doudian_open_id
    - open_address_id
    - yuce_cube_shop_id
    - pay_time
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」或「空值个数/总行数，固定值」；第一阶段只预警，不阻断。
    sql_template: select sum(case when `__id` is null then 1 else 0 end) as `__id__null_count`, sum(case when `order_id` is null then 1 else 0 end) as `order_id__null_count`,
      sum(case when `spbm` is null then 1 else 0 end) as `spbm__null_count`, sum(case when `skuid` is null then 1 else 0 end) as `skuid__null_count`, sum(case when
      `doudian_open_id` is null then 1 else 0 end) as `doudian_open_id__null_count` from cubeappdata.`ud_3418004512502203_sxssjqx` where cast(`pay_time` as date)
      = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 核心字段来自字段名、候选主键、业务日期、金额/关联键证据，不依赖复杂业务口径。
  - rule_name: ud_3418004512502203_sxssjqx__amount_fields_format_and_non_negative
    rule_type: 金额字段格式/非负
    description: 检查金额、成本、推广费字段是否可转数字，以及一般金额是否出现负数。
    target_fields:
    - xfzsfje
    - cjje
    - sjssje
    - promotion_talent_amount
    - promotion_pay_amount
    - promotion_redpack_amount
    check_grain: latest_business_date_or_task_run
    bi_config_method: 数值字段优先使用 BI 字段规则「最小值/最大值」及波动类规则；文本金额字段先做空值/格式确认，数值可转换性用 SQL 兜底。
    sql_template: select sum(case when `xfzsfje` is not null and cast(`xfzsfje` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `xfzsfje__not_numeric_count`,
      sum(case when cast(`xfzsfje` as double) < 0 then 1 else 0 end) as `xfzsfje__negative_count`, sum(case when `cjje` is not null and cast(`cjje` as string) regexp
      '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `cjje__not_numeric_count`, sum(case when cast(`cjje` as double) < 0 then 1 else 0 end) as `cjje__negative_count`,
      sum(case when `sjssje` is not null and cast(`sjssje` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `sjssje__not_numeric_count`, sum(case
      when cast(`sjssje` as double) < 0 then 1 else 0 end) as `sjssje__negative_count`, sum(case when `promotion_talent_amount` is not null and cast(`promotion_talent_amount`
      as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `promotion_talent_amount__not_numeric_count`, sum(case when cast(`promotion_talent_amount`
      as double) < 0 then 1 else 0 end) as `promotion_talent_amount__negative_count` from cubeappdata.`ud_3418004512502203_sxssjqx` where cast(`pay_time` as date)
      = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 阈值类波动暂不配置；负数是否允许需后续按字段确认。
  - rule_name: ud_3418004512502203_sxssjqx__biz_date_castable
    rule_type: 业务日期格式
    description: 检查业务日期字段非空且可作为日期使用。
    target_fields:
    - pay_time
    check_grain: latest_business_date_or_task_run
    bi_config_method: 字段日期格式内置规则或自定义 SQL。
    sql_template: select sum(case when `pay_time` is null then 1 else 0 end) as null_date_count from cubeappdata.`ud_3418004512502203_sxssjqx` where cast(`pay_time`
      as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 如果字段是时间戳/字符串，正式配置前按样例确认日期格式。
