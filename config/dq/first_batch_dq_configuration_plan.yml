    bi_config_method: 优先配置字段存在/字段数规则；没有内置项时用自定义 SQL 查 information_schema.columns。
    sql_template: select case when count(*) < {expected_min_field_count} then 1 else 0 end as violation_count from information_schema.columns where table_schema='cubeappdata'
      and table_name='tianmaosixiaoshoushouhoushuju';
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 用于发现影刀抓取页面/API 字段变更。
  - rule_name: tianmaosixiaoshoushouhoushuju__primary_key_null_and_duplicate
    rule_type: 主键非空/重复
    description: 检查候选主键非空和重复。
    target_fields: *id068
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」和「重复值个数，固定值」；大表必须配置昨天分区或昨天业务日期参数。组合主键无法表达时 SQL 兜底。
    sql_template: select sum(case when `__id` is null or `售后单号` is null or `内部订单号` is null or `线上订单号` is null then 1 else 0 end) as null_key_count, count(*) - count(distinct
      concat_ws('#', `__id`, `售后单号`, `内部订单号`, `线上订单号`)) as duplicate_key_count from cubeappdata.`tianmaosixiaoshoushouhoushuju` where cast(`登记时间` as date) = date_sub(current_date(),
      interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
