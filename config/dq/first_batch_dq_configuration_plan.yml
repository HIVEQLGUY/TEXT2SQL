  rules:
  - rule_name: dws_douyin_spu_sales_detail__yesterday_biz_date_row_count_nonzero
    rule_type: 昨天业务日期行数存在
    description: 检查昨天业务日期是否有数据，避免结果表空跑。
    target_fields:
    - pay_time
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 表规则「单日行数，固定值」，日期参数传昨天业务日期；无日期字段时退化为任务产出行数 > 0。SQL 仅兜底。
    sql_template: select case when count(*) = 0 then 1 else 0 end as violation_count from cubeappdata.`dws_douyin_spu_sales_detail` where cast(`pay_time` as date)
      = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 第一阶段只检查是否存在数据，不设置业务波动阈值。
  - rule_name: dws_douyin_spu_sales_detail__primary_key_null_and_duplicate
    rule_type: 主键非空/重复
    description: 检查候选主键非空和重复。
    target_fields: *id001
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」和「重复值个数，固定值」；大表必须配置昨天分区或昨天业务日期参数。组合主键无法表达时 SQL 兜底。
    sql_template: select sum(case when `__id` is null then 1 else 0 end) as null_key_count, count(*) - count(distinct concat_ws('#', `__id`)) as duplicate_key_count
      from cubeappdata.`dws_douyin_spu_sales_detail` where cast(`pay_time` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 可按昨天业务日期或任务产出行数查重。
  - rule_name: dws_douyin_spu_sales_detail__core_fields_null
    rule_type: 核心字段空值
    description: 检查主键、业务日期、商品/店铺/订单/金额等核心字段空值。
    target_fields:
    - __id
    - spbm
    - pay_time
    - account_amount
    - bhstghf
    - cgje
    - cgjejbm
    - cgjexbm
    check_grain: latest_business_date_or_task_run
    bi_config_method: 优先使用 BI 字段规则「空值个数，固定值」或「空值个数/总行数，固定值」；第一阶段只预警，不阻断。
    sql_template: select sum(case when `__id` is null then 1 else 0 end) as `__id__null_count`, sum(case when `spbm` is null then 1 else 0 end) as `spbm__null_count`,
      sum(case when `pay_time` is null then 1 else 0 end) as `pay_time__null_count`, sum(case when `account_amount` is null then 1 else 0 end) as `account_amount__null_count`,
      sum(case when `bhstghf` is null then 1 else 0 end) as `bhstghf__null_count` from cubeappdata.`dws_douyin_spu_sales_detail` where cast(`pay_time` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 核心字段来自字段名、候选主键、业务日期、金额/关联键证据，不依赖复杂业务口径。
  - rule_name: dws_douyin_spu_sales_detail__amount_fields_format_and_non_negative
    rule_type: 金额字段格式/非负
    description: 检查金额、成本、推广费字段是否可转数字，以及一般金额是否出现负数。
    target_fields:
    - sjssje
    - zyf
    - cgje
    - dyyfysjlhtxhd
    - account_amount
    - cwsdkcje
    check_grain: latest_business_date_or_task_run
    bi_config_method: 数值字段优先使用 BI 字段规则「最小值/最大值」及波动类规则；文本金额字段先做空值/格式确认，数值可转换性用 SQL 兜底。
    sql_template: select sum(case when `sjssje` is not null and cast(`sjssje` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `sjssje__not_numeric_count`,
      sum(case when cast(`sjssje` as double) < 0 then 1 else 0 end) as `sjssje__negative_count`, sum(case when `zyf` is not null and cast(`zyf` as string) regexp
      '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `zyf__not_numeric_count`, sum(case when cast(`zyf` as double) < 0 then 1 else 0 end) as `zyf__negative_count`,
      sum(case when `cgje` is not null and cast(`cgje` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `cgje__not_numeric_count`, sum(case
      when cast(`cgje` as double) < 0 then 1 else 0 end) as `cgje__negative_count`, sum(case when `dyyfysjlhtxhd` is not null and cast(`dyyfysjlhtxhd` as string)
      regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `dyyfysjlhtxhd__not_numeric_count`, sum(case when cast(`dyyfysjlhtxhd` as double) < 0 then 1 else
      0 end) as `dyyfysjlhtxhd__negative_count` from cubeappdata.`dws_douyin_spu_sales_detail` where cast(`pay_time` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 阈值类波动暂不配置；负数是否允许需后续按字段确认。
