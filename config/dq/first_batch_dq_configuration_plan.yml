  rules:
  - rule_name: liuliangshuju__task_output_row_count_nonzero
    rule_type: 任务产出行数/自定义SQL
    description: 检查本次更新任务是否真实产出数据，重点防任务成功但 0 行。
    target_fields: []
    check_grain: task_run
    bi_config_method: 优先在任务详情中配置任务产出行数 > 0；如果只能写 SQL，则配置整表非空或按昨天业务日期非空。
    sql_template: select case when count(*) = 0 then 1 else 0 end as violation_count from cubeappdata.`liuliangshuju`;
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
