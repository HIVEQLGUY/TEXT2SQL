      1 else 0 end) as `pay_amount__negative_count`, sum(case when `paid_amount` is not null and cast(`paid_amount` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false
      then 1 else 0 end) as `paid_amount__not_numeric_count`, sum(case when cast(`paid_amount` as double) < 0 then 1 else 0 end) as `paid_amount__negative_count`,
      sum(case when `buyer_paid_amount` is not null and cast(`buyer_paid_amount` as string) regexp '^-?[0-9]+(\\.[0-9]+)?$' = false then 1 else 0 end) as `buyer_paid_amount__not_numeric_count`,
      sum(case when cast(`buyer_paid_amount` as double) < 0 then 1 else 0 end) as `buyer_paid_amount__negative_count` from cubeappdata.`ods_api_jstqm_sale_order_info_f`
      where cast(`dt` as date) = date_sub(current_date(), interval 1 day);
    alert_level: warning
    threshold_status: no_business_threshold_required
    notes:
    - 阈值类波动暂不配置；负数是否允许需后续按字段确认。
